services:
  caddy:
    image: caddy:2-alpine
    container_name: hls-caddy
    restart: unless-stopped
    depends_on:
      gameserver:
        condition: service_healthy
    environment:
      HLS_API_DOMAIN: ${HLS_API_DOMAIN:?set HLS_API_DOMAIN in server/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  gameserver:
    image: kaolengmian77/hls-gameserver:latest
    container_name: hls-gameserver
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      HLS_HOST: 0.0.0.0
    expose:
      - "8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/api/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

  mysql:
    image: mysql:8.0
    container_name: hls-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in server/.env}
      MYSQL_DATABASE: hls
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
