<h2>每一格显示什么内容？</h2>
<p class="subtitle">老虎机滚动时，每一行格子里放什么？</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;height:160px;border-radius:8px 8px 0 0;">
      <div style="width:72px;height:72px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#dc2626);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 4px 16px rgba(245,158,11,0.4);">💎</div>
    </div>
    <div class="card-body">
      <h3>只显示图片</h3>
      <p>大图，视觉冲击强，滚动时图片快速闪过。名字在停稳后单独展示。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;height:160px;border-radius:8px 8px 0 0;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:52px;height:52px;border-radius:8px;background:linear-gradient(135deg,#f59e0b,#dc2626);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(245,158,11,0.4);">💎</div>
        <div style="color:#f5e6c8;font-size:12px;font-weight:600;letter-spacing:0.05em;text-shadow:0 1px 4px rgba(0,0,0,0.8);">海洋之泪</div>
      </div>
    </div>
    <div class="card-body">
      <h3>图片 + 名字</h3>
      <p>图片稍小，下方带名字标签。滚动时玩家能同时看到图和名字。</p>
    </div>
  </div>
</div>
